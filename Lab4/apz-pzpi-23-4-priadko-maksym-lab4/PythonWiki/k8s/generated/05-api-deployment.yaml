apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythonwiki-api
  namespace: pythonwiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pythonwiki-api
  template:
    metadata:
      labels:
        app: pythonwiki-api
      annotations:
        lab4/deploy-version: "20260528134548"
    spec:
      containers:
        - name: api
          image: pythonwiki-api:lab4
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: pythonwiki-db-secret
                  key: CONNECTION_STRING
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
